---
name: Lint Docs Markdown

# The shared reusable workflow (lint-md-links.yml) uses markdownlint-cli2-action's
# default `globs: '*.{md,markdown}'`, which only matches root-level files — anything
# under docs/ (e.g. docs/plans/*.md) is never markdownlint-checked. This supplementary
# workflow closes that gap without modifying the shared reusable. Link-checking already
# covers subdirectories (lychee's `**/*.md` glob in the reusable), so only markdown
# linting needs a repo-local stand-in here.

on:
  push:
    branches: [main]
    paths: [docs/**/*.md]
  pull_request:
    branches: [main]
    paths: [docs/**/*.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fall back to shared markdownlint config
        run: |
          if [ ! -f .markdownlint.jsonc ] && [ ! -f .markdownlint.json ]; then
            curl -fsSL https://raw.githubusercontent.com/qte77/.github/main/.markdownlint.jsonc -o .markdownlint.jsonc
          fi
      - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9  # v23.0.0
        with:
          globs: docs/**/*.md
...

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reason: shellcheck 0.9.0-1 ships preinstalled on the ubuntu-latest
      # (Ubuntu 24.04) runner image — no install step needed.
      # Reason: nullglob so a future-empty/removed .github/scripts/ (planned in
      # a sibling arc row) drops out of the glob instead of shellcheck failing
      # on the unmatched literal pattern.
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          targets=(scripts/*.sh .github/scripts/*.sh)
          shellcheck "${targets[@]}"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reason: actionlint is not preinstalled on ubuntu-latest; install via the
      # project's own download script (smaller supply-chain surface than a
      # marketplace action), pinned to a specific release tag/version.
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash") 1.7.12

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color

---
name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '[major|minor|patch]'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

jobs:
  bump:
    # Reason: pin the PyPI bump-my-version version explicitly rather than trust the
    # reusable's own default, to preserve this repo's tested behaviour (the version it
    # replaces, callowayproject/bump-my-version@1.5.1, pinned the same PyPI release).
    uses: qte77/.github/.github/workflows/bump-version.yml@4801217a20922cd54187fc7e4c98c7ea78c0ec9a  # main @ 2026-09-09
    with:
      bump_type: ${{ inputs.bump_type }}
      bump_my_version_pin: '1.5.1'
    permissions:
      contents: write
      pull-requests: write
...

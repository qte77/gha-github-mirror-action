---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      actions-version-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
